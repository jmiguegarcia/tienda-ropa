<section class="tarjeta-auth">
  <h1>Entrar</h1>
  <p class="intro">Inicia sesión para seguir tus compras en All Style.</p>

  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <label class="campo">
      <span>Correo electrónico</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        (input)="sinCuenta.set(null)"
      />
      @if (invalido('email')) {
        <span class="error-campo">Escribe un correo válido.</span>
      }
    </label>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="con-boton">
        <input
          id="password"
          [type]="verPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="ver"
          (click)="verPassword.set(!verPassword())"
          [attr.aria-pressed]="verPassword()"
        >
          {{ verPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (invalido('password')) {
        <span class="error-campo">Escribe tu contraseña.</span>
      }
    </div>

    @if (sinCuenta(); as email) {
      <div class="sin-cuenta" role="alert">
        <p>Este correo no se encuentra registrado, ¿quieres crear una cuenta?</p>
        <!-- El correo va en el estado de la navegación, no en la URL (no queda en historial ni logs) -->
        <a
          class="secundario"
          routerLink="/registro"
          [queryParams]="{ volver: volver() }"
          [state]="{ email }"
        >
          Crear cuenta
        </a>
      </div>
    }

    @if (error()) {
      <p class="error-envio" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="principal" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="alternativa">
    ¿No tienes cuenta?
    <a routerLink="/registro" [queryParams]="{ volver: volver() }">Crea una</a>
  </p>
</section>
