<section class="tarjeta-auth">
  <h1>Crear cuenta</h1>
  <p class="intro">Regístrate para comprar más rápido y seguir tus pedidos.</p>

  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <label class="campo">
      <span>Nombre</span>
      <input type="text" formControlName="nombre" autocomplete="name" maxlength="100" />
      @if (invalido('nombre')) {
        <span class="error-campo">Escribe tu nombre.</span>
      }
    </label>

    <label class="campo">
      <span>Correo electrónico</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        [class.invalido]="emailEnUso()"
        (input)="emailEnUso.set(false)"
      />
      @if (emailEnUso()) {
        <span class="error-campo">
          Ya existe una cuenta con este correo.
          <a routerLink="/entrar" [queryParams]="{ volver: volver() }">Entra con ella</a>
        </span>
      } @else if (invalido('email')) {
        <span class="error-campo">Escribe un correo válido.</span>
      }
    </label>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="con-boton">
        <input
          id="password"
          [type]="verPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          aria-describedby="ayuda-password"
        />
        <button
          type="button"
          class="ver"
          (click)="verPassword.set(!verPassword())"
          [attr.aria-pressed]="verPassword()"
        >
          {{ verPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (invalido('password')) {
        <span class="error-campo" id="ayuda-password">
          La contraseña debe tener al menos 8 caracteres.
        </span>
      } @else {
        <span class="ayuda" id="ayuda-password">Mínimo 8 caracteres.</span>
      }
    </div>

    @if (error()) {
      <p class="error-envio" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="principal" [disabled]="enviando()">
      {{ enviando() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="alternativa">
    ¿Ya tienes cuenta?
    <a routerLink="/entrar" [queryParams]="{ volver: volver() }">Entra</a>
  </p>
</section>
