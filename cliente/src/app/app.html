<header class="cabecera">
  <a class="marca" routerLink="/">
    <svg class="marca-icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 3a9 9 0 1 0 6 15.7A7.5 7.5 0 0 1 15 3Z" />
      <path d="m19 4 .6 1.4L21 6l-1.4.6L19 8l-.6-1.4L17 6l1.4-.6Z" />
    </svg>
    All Style
  </a>

  <nav class="acciones" aria-label="Cuenta y carrito">
    @if (auth.usuario(); as usuario) {
      <span class="saludo" [attr.title]="usuario.email">
        <span class="hola">Hola, </span>{{ primerNombre(usuario.nombre) }}
      </span>
      <button type="button" class="sesion" (click)="salir()">Salir</button>
    } @else {
      <a class="sesion" routerLink="/entrar" [queryParams]="{ volver: urlActual() }">Entrar</a>
    }

    <a
      class="ir-carrito"
      routerLink="/carrito"
      [attr.aria-label]="'Carrito, ' + carrito.unidades() + (carrito.unidades() === 1 ? ' producto' : ' productos')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 7h12l-1 13H7L6 7Z" />
        <path d="M9 7a3 3 0 0 1 6 0" />
      </svg>
      @if (carrito.unidades() > 0) {
        <span class="contador" aria-hidden="true">{{ carrito.unidades() }}</span>
      }
    </a>
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
